# IntelliJ Platform Plugin — Pgyer APK Uploader
pluginGroup=com.pgyer.ide
pluginName=Pgyer APK Uploader
pluginId=com.pgyer.ide.apkuploader
pluginVersion=1.0.0
pluginSinceBuild=243

# Toolchain (must stay aligned — see README)
# - IntelliJ Platform Gradle Plugin 2.19+ requires Gradle 9.0+
# - Run Gradle with JDK 17 or 21 (JDK 24+ needs Gradle 8.14+/9.x; prefer 21)
gradleVersion=9.0.0

# Opt-out of bundling Kotlin stdlib (provided by the IDE)
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# Prefer auto-provisioned JDKs for toolchains / daemon JVM criteria
org.gradle.java.installations.auto-download=true
